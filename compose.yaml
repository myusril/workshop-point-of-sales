name: workshop-pos

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      # PostgreSQL 19 images keep PGDATA below /var/lib/postgresql.
      - workshop_pos_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: runner
    image: workshop-pos-web:${APP_VERSION:-local}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Built from the database credentials so the host-scoped .env value
      # (localhost:55432) can never leak into the container network.
      # Keep POSTGRES_PASSWORD URL-safe: it is embedded in this URL.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_URL: ${APP_URL:-http://localhost}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      # Required in production: never ship a default signing secret. Generate
      # one with `openssl rand -base64 32` and keep it out of the repository.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - workshop_pos_caddy_data:/data
      - workshop_pos_caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  # Optional encrypted backup sidecar (docs/ops/backup-runbook.md).
  # Disabled by default: start it explicitly with
  #   docker compose --profile backup up -d
  # It writes AES-256 encrypted custom-format dumps to a named volume and never
  # stores the passphrase or database password in the image.
  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    image: workshop-pos-backup:${APP_VERSION:-local}
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      # Empty by default so the normal stack still renders without a backup
      # secret; the entrypoint fails closed when the profile is enabled
      # without a passphrase or a readable passphrase file.
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_PASSPHRASE_FILE: ${BACKUP_PASSPHRASE_FILE:-}
      PGPASSFILE: ${PGPASSFILE:-}
      PGCONNECT_TIMEOUT: "10"
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-900}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - workshop_pos_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Unhealthy when the newest encrypted dump is older than two intervals.
      test:
        [
          "CMD-SHELL",
          "max=$$(( $${BACKUP_INTERVAL_SECONDS:-900} * 2 / 60 )); find /backups -maxdepth 1 -name 'workshop-pos-*.dump.enc' -mmin -$$max | grep -q .",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 180s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    restart: unless-stopped

volumes:
  workshop_pos_db:
  workshop_pos_caddy_data:
  workshop_pos_caddy_config:
  workshop_pos_backups:
